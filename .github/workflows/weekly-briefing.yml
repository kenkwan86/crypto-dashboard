name: weekly-briefing

on:
  schedule:
    - cron: "30 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt anthropic
      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m briefing.generate
      - name: Commit report
        run: |
          git config user.name "collector-bot"
          git config user.email "actions@github.com"
          git add briefing/reports/
          git diff --cached --quiet || git commit -m "briefing: weekly report"
          git pull --rebase origin main
          git push
